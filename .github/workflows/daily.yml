name: Daily Contribution

on:
  schedule:
    - cron: '0 14 * * *'   # 7:30 PM IST
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Generate multiple commits
        run: |
          git config --global user.name "Dhanya Sree K G"
          git config --global user.email "dhanyakathir2005@gmail.com"

          messages=("Fixed bug" "Updated notes" "Refactored code" "Learning progress" "Minor improvements")

          for i in {0..4}
          do
            echo "${messages[$i]} - $(date)" >> update.txt
            git add update.txt
            git commit -m "${messages[$i]} on $(date)" || echo "Nothing to commit"
          done

          git push
